changelog:
  categories:
    - title: '新功能'
      labels:
        - 'feat'
        - 'feature'
        - 'enhancement'
    - title: '修复'
      labels:
        - 'fix'
        - 'bug'
        - 'bugfix'
    - title: '改进'
      labels:
        - 'perf'
        - 'performance'
        - 'refactor'
        - 'ui'
        - 'style'
        - 'ux'
  exclude:
    labels:
      - 'chore'
      - 'ci'
      - 'build'
      - 'docs'
      - 'ignore-for-release'
      - 'skip-changelog'
    authors:
      - 'dependabot[bot]'
