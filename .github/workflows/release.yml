name: Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如 v0.3.0，留空则自动读取 Cargo.toml)'
        required: false
        type: string
      draft:
        description: '是否保持为草稿 (Draft)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.prepare_release.outputs.release_id }}
      tag_name: ${{ steps.prepare_release.outputs.tag_name }}
      version: ${{ steps.prepare_release.outputs.version }}
      notes_b64: ${{ steps.prepare_release.outputs.notes_b64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version & Prepare Release
        id: prepare_release
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag_name || '' }}
          DRAFT: ${{ inputs.draft || 'false' }}
          PRERELEASE: ${{ inputs.prerelease || 'false' }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const cargoToml = fs.readFileSync('./crates/pivot-desktop/Cargo.toml', 'utf8');
            const verMatch = cargoToml.match(/^version\s*=\s*"([^"]+)"/m);
            const cargoVersion = verMatch ? verMatch[1] : '0.3.0';

            let tagName = process.env.INPUT_TAG;
            if (!tagName) {
              if (context.ref && context.ref.startsWith('refs/tags/')) {
                tagName = context.ref.replace('refs/tags/', '');
              } else {
                tagName = `v${cargoVersion}`;
              }
            }
            const cleanVersion = tagName.replace(/^v/, '');
            console.log(`Target release tag: ${tagName} (version: ${cleanVersion})`);

            const isPrerelease = process.env.PRERELEASE === 'true';

            function buildReleaseLogs(tag) {
              try {
                execSync('git fetch --tags --force 2>/dev/null || true', { encoding: 'utf8' });
              } catch (e) {}

              let targetRef = 'HEAD';
              try {
                execSync(`git rev-parse --verify "${tag}^{commit}" 2>/dev/null`, { encoding: 'utf8' });
                targetRef = tag;
              } catch (e) {
                targetRef = 'HEAD';
              }

              let prevTag = '';
              try {
                prevTag = execSync(`git describe --tags --abbrev=0 "${targetRef}^" 2>/dev/null`, { encoding: 'utf8' }).trim();
              } catch (e) {
                prevTag = '';
              }

              const range = prevTag ? `${prevTag}..${targetRef}` : targetRef;
              let rawLog = '';
              try {
                rawLog = execSync(`git log ${range} --pretty=format:"%h|%s" --no-merges`, { encoding: 'utf8' }).trim();
              } catch (e) {
                return { prevTag, markdownChangelog: '', plainNotes: '' };
              }
              if (!rawLog) return { prevTag, markdownChangelog: '', plainNotes: '' };

              const categories = {
                features: { title: '### 新功能', items: [], plainItems: [] },
                fixes: { title: '### 修复', items: [], plainItems: [] },
                improvements: { title: '### 改进', items: [], plainItems: [] },
              };
              const maintenance = { items: [], plainItems: [] };

              const commitBaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit`;
              const lines = rawLog.split('\n').filter(Boolean);
              for (const line of lines) {
                const sepIndex = line.indexOf('|');
                if (sepIndex === -1) continue;
                const hash = line.slice(0, sepIndex).trim();
                const msg = line.slice(sepIndex + 1).trim();
                if (!msg) continue;
                if (/^(chore\s*\(\s*release\s*\)|release)\s*:/i.test(msg)) continue;

                const matched = msg.match(/^([a-z]+)(?:\(([^)]*)\))?!?\s*:\s*(.+)$/i);
                let bucket = categories.improvements;
                let cleanText = msg;

                if (matched) {
                  const type = matched[1].toLowerCase();
                  const scope = (matched[2] || '').toLowerCase().trim();
                  cleanText = matched[3].trim();

                  if (
                    ['chore', 'ci', 'build', 'docs', 'doc', 'test', 'tests'].includes(type) ||
                    ['ci', 'release', 'workflow', 'scripts'].includes(scope)
                  ) {
                    bucket = maintenance;
                  } else if (type === 'feat' || type === 'feature') {
                    bucket = categories.features;
                  } else if (type === 'fix' || type === 'bugfix') {
                    bucket = categories.fixes;
                  } else {
                    bucket = categories.improvements;
                  }
                }

                if (!cleanText) continue;
                const item = `- ${cleanText} ([${hash}](${commitBaseUrl}/${hash}))`;
                bucket.items.push(item);
                bucket.plainItems.push(cleanText);
              }

              const sections = [];
              for (const key of ['features', 'fixes', 'improvements']) {
                const cat = categories[key];
                if (cat.items.length > 0) {
                  sections.push(`${cat.title}\n\n${cat.items.join('\n')}`);
                }
              }
              if (sections.length === 0 && maintenance.items.length > 0) {
                sections.push(`${categories.improvements.title}\n\n${maintenance.items.join('\n')}`);
              }

              const plainCollected = [];
              const seenPlain = new Set();
              for (const key of ['features', 'fixes', 'improvements']) {
                for (const text of categories[key].plainItems) {
                  if (text && !seenPlain.has(text)) {
                    seenPlain.add(text);
                    plainCollected.push(`• ${text}`);
                  }
                }
              }
              if (plainCollected.length === 0) {
                for (const text of maintenance.plainItems) {
                  if (text && !seenPlain.has(text)) {
                    seenPlain.add(text);
                    plainCollected.push(`• ${text}`);
                  }
                }
              }

              return {
                prevTag,
                markdownChangelog: sections.join('\n\n'),
                plainNotes: plainCollected.join('\n'),
              };
            }

            const { prevTag, markdownChangelog: gitChangelog, plainNotes: gitPlainNotes } = buildReleaseLogs(tagName);

            let apiNotes = '';
            try {
              const notesRes = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                target_commitish: context.sha,
              });
              apiNotes = notesRes.data.body || '';
            } catch (notesErr) {
              console.log('generateReleaseNotes warning:', notesErr.message);
            }

            let finalPlainNotes = gitPlainNotes;
            if (!finalPlainNotes && apiNotes) {
              const fallbackItems = [];
              for (const rawLine of apiNotes.split('\n')) {
                const trimmed = rawLine.trim();
                if (!trimmed.startsWith('* ') && !trimmed.startsWith('- ')) continue;
                const withoutMeta = trimmed
                  .slice(2)
                  .replace(/\s+by\s+@\S+\s+in\s+https?:\/\/\S+$/i, '')
                  .trim();
                if (!withoutMeta || /^(chore\s*\(\s*release\s*\)|release)\s*:/i.test(withoutMeta)) {
                  continue;
                }
                const cleaned = withoutMeta
                  .replace(/^[a-z]+(\([^)]+\))?!?:\s*/i, '')
                  .trim();
                if (cleaned) {
                  fallbackItems.push(`• ${cleaned}`);
                }
              }
              finalPlainNotes = fallbackItems.join('\n');
            }

            let changelogContent = '';
            if (gitChangelog) {
              changelogContent = gitChangelog;
            } else if (apiNotes) {
              changelogContent = apiNotes.trim();
            } else {
              changelogContent = `发布版本 ${tagName}。`;
            }

            const compareLink = prevTag
              ? `**完整变更**: [\`${prevTag}...${tagName}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${prevTag}...${tagName})`
              : `**提交记录**: [\`${tagName}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commits/${tagName})`;

            const finalBody = `${changelogContent}\n\n${compareLink}\n`;

            let release;
            let existing = null;
            try {
              const resp = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              existing = resp.data;
            } catch (err) {
              if (err.status !== 404) {
                throw err;
              }
            }
            if (existing) {
              const updated = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
                body: finalBody,
              });
              release = updated.data;
            } else {
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                target_commitish: context.sha,
                name: `Pivot ${tagName}`,
                body: finalBody,
                draft: true,
                prerelease: isPrerelease,
              });
              release = created.data;
            }

            core.setOutput('release_id', release.id.toString());
            core.setOutput('tag_name', tagName);
            core.setOutput('version', cleanVersion);
            core.setOutput('notes_b64', Buffer.from(finalPlainNotes, 'utf8').toString('base64'));

  build-macos:
    name: Build macOS Universal App
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}

      - name: Verify Crate Versions Match Tag
        run: |
          EXPECTED="${{ needs.create-release.outputs.version }}"
          DESKTOP_VER="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/pivot-desktop/Cargo.toml | head -n 1)"
          CORE_VER="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/pivot-core/Cargo.toml | head -n 1)"
          if [ "${DESKTOP_VER}" != "${EXPECTED}" ] || [ "${CORE_VER}" != "${EXPECTED}" ]; then
            echo "Version mismatch: tag=${EXPECTED}, desktop=${DESKTOP_VER}, core=${CORE_VER}" >&2
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: gpui-universal

      - name: Run Core Unit Tests
        run: cargo test --workspace

      - name: Build Apple Silicon Release Binary
        run: cargo build --release --target aarch64-apple-darwin -p pivot-desktop

      - name: Build Intel Release Binary
        run: cargo build --release --target x86_64-apple-darwin -p pivot-desktop

      - name: Package Pivot.app & Universal DMG Installer
        run: bash scripts/bundle_macos.sh universal "${{ needs.create-release.outputs.version }}"

      - name: Upload DMG to Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          DMG_NAME: Pivot.dmg
        with:
          script: |
            const fs = require('fs');
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const dmgName = process.env.DMG_NAME;
            const dmgPath = `target/bundle/${dmgName}`;
            const data = fs.readFileSync(dmgPath);
            console.log(`Uploading ${dmgName} (${data.length} bytes) to release ${releaseId}...`);

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            const existingAsset = assets.find((a) => a.name === dmgName);
            if (existingAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existingAsset.id,
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: dmgName,
              data,
              headers: {
                'content-type': 'application/x-apple-diskimage',
                'content-length': data.length,
              },
            });
            console.log(`Uploaded ${dmgName} successfully.`);

  publish-release:
    name: Publish Release
    needs: [create-release, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Generate & Upload latest.json Update Manifest
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
          VERSION: ${{ needs.create-release.outputs.version }}
          NOTES_B64: ${{ needs.create-release.outputs.notes_b64 || '' }}
        with:
          script: |
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const tagName = process.env.TAG_NAME;
            const version = process.env.VERSION;
            const notes = process.env.NOTES_B64
              ? Buffer.from(process.env.NOTES_B64, 'base64').toString('utf8').trim()
              : '';
            const downloadBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tagName}`;

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            const oldManifest = assets.find((a) => a.name === 'latest.json');
            if (oldManifest) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: oldManifest.id,
              });
            }

            const manifest = {
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: {
                'darwin-aarch64': {
                  url: `${downloadBase}/Pivot.dmg`,
                },
                'darwin-x86_64': {
                  url: `${downloadBase}/Pivot.dmg`,
                },
              },
            };

            const body = JSON.stringify(manifest, null, 2);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'latest.json',
              data: Buffer.from(body, 'utf8'),
              headers: {
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(body),
              },
            });

      - name: Publish Release if not requested as Draft
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          DRAFT: ${{ inputs.draft || 'false' }}
        with:
          script: |
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const isDraftRequested = process.env.DRAFT === 'true';

            if (!isDraftRequested) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                draft: false,
              });
              console.log('Release published successfully.');
            }
