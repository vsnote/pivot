name: Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如 v0.1.0，留空则自动读取 package.json)'
        required: false
        type: string
      draft:
        description: '是否保持为草稿 (Draft)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.prepare_release.outputs.release_id }}
      tag_name: ${{ steps.prepare_release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version & Prepare Release
        id: prepare_release
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag_name || '' }}
          DRAFT: ${{ inputs.draft || 'false' }}
          PRERELEASE: ${{ inputs.prerelease || 'false' }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const pkgVersion = pkg.version;

            let tagName = process.env.INPUT_TAG;
            if (!tagName) {
              if (context.ref && context.ref.startsWith('refs/tags/')) {
                tagName = context.ref.replace('refs/tags/', '');
              } else {
                tagName = `v${pkgVersion}`;
              }
            }
            console.log(`Target release tag: ${tagName}`);

            const isPrerelease = process.env.PRERELEASE === 'true';

            // 1. 从 Git Log 智能提取与分类提交记录 (Changelog)
            function generateGitChangelog(tag) {
              let prevTag = '';
              try {
                prevTag = execSync(`git describe --tags --abbrev=0 "${tag}^" 2>/dev/null`, { encoding: 'utf8' }).trim();
              } catch (e) {
                prevTag = '';
              }

              const range = prevTag ? `${prevTag}..${tag}` : (tag || 'HEAD');
              let rawLog = '';
              try {
                rawLog = execSync(`git log ${range} --pretty=format:"%h|%s" --no-merges`, { encoding: 'utf8' }).trim();
              } catch (e) {
                return '';
              }
              if (!rawLog) return '';

              const categories = {
                features: { title: '### 🚀 新功能 (Features)', items: [] },
                fixes: { title: '### 🐛 漏洞修复 (Bug Fixes)', items: [] },
                perf: { title: '### ⚡ 优化与重构 (Refactoring & Performance)', items: [] },
                ui: { title: '### 💄 界面与体验 (UI & Styling)', items: [] },
                maintenance: { title: '### 🔧 工具与构建 (Tooling & Maintenance)', items: [] },
                others: { title: '### 📦 其他更新 (Other Changes)', items: [] },
              };

              const lines = rawLog.split('\n').filter(Boolean);
              for (const line of lines) {
                const sepIndex = line.indexOf('|');
                if (sepIndex === -1) continue;
                const hash = line.slice(0, sepIndex).trim();
                const msg = line.slice(sepIndex + 1).trim();
                if (!msg) continue;

                const lower = msg.toLowerCase();
                const item = `- ${msg} ([${hash}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${hash}))`;

                if (lower.startsWith('feat')) {
                  categories.features.items.push(item);
                } else if (lower.startsWith('fix')) {
                  categories.fixes.items.push(item);
                } else if (lower.startsWith('perf') || lower.startsWith('refactor')) {
                  categories.perf.items.push(item);
                } else if (lower.startsWith('style') || lower.startsWith('ui')) {
                  categories.ui.items.push(item);
                } else if (lower.startsWith('chore') || lower.startsWith('ci') || lower.startsWith('build')) {
                  categories.maintenance.items.push(item);
                } else {
                  categories.others.items.push(item);
                }
              }

              const sections = [];
              for (const key of Object.keys(categories)) {
                const cat = categories[key];
                if (cat.items.length > 0) {
                  sections.push(`${cat.title}\n\n${cat.items.join('\n')}`);
                }
              }

              return sections.join('\n\n');
            }

            const gitChangelog = generateGitChangelog(tagName);

            // 2. 尝试调用 GitHub API 获取 PR Notes (如包含贡献者等信息)
            let apiNotes = '';
            try {
              const notesRes = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                target_commitish: context.sha,
              });
              apiNotes = notesRes.data.body || '';
            } catch (notesErr) {
              console.log('generateReleaseNotes warning:', notesErr.message);
            }

            // 3. 组装说明文档，包含 macOS 各架构下载指引与安全拦截提示
            const macosNotice = [
              '### 🍎 macOS 安装与下载说明',
              '',
              '| 芯片架构 | 适用机型 | 安装包推荐 |',
              '| :--- | :--- | :--- |',
              '| **Apple Silicon** | M1 / M2 / M3 / M4 及后续芯片 Mac | `Pivot_*_aarch64.dmg` |',
              '| **Intel** | 采用 Intel 处理器的传统 Mac | `Pivot_*_x64.dmg` |',
              '',
              '> **💡 首次打开提示「已损坏」或「无法打开」？**',
              '> 由于开源分发未内置苹果商业付费证书签名，macOS Gatekeeper 可能会弹出拦截提示。可通过以下方式解决：',
              '> 1. 打开系统「设置」->「隐私与安全性」，在安全性部分找到提示并点击「仍要打开」。',
              '> 2. 或在终端 (Terminal) 中执行以下命令去除隔离标记：',
              '>    ```bash',
              '>    sudo xattr -r -d com.apple.quarantine /Applications/Pivot.app',
              '>    ```',
              '',
              '---',
              '',
            ].join('\n');

            let changelogContent = '';
            if (gitChangelog) {
              changelogContent = `## 📝 更新日志 (Changelog)\n\n${gitChangelog}`;
            } else if (apiNotes) {
              changelogContent = `## 📝 更新日志 (Changelog)\n\n${apiNotes}`;
            } else {
              changelogContent = `## 📝 更新日志 (Changelog)\n\n发布版本 ${tagName}。`;
            }

            const finalBody = `${macosNotice}${changelogContent}\n\n---\n**完整提交历史**: https://github.com/${context.repo.owner}/${context.repo.repo}/commits/${tagName}\n`;

            // 4. 查找或创建 Release
            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              release = existing.data;
              console.log(`Found existing release ID: ${release.id}, updating body with Changelog...`);
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body: finalBody,
              });
            } catch (err) {
              console.log(`Creating release for tag ${tagName}...`);
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                target_commitish: context.sha,
                name: `Pivot ${tagName}`,
                body: finalBody,
                draft: true,
                prerelease: isPrerelease,
              });
              release = created.data;
            }

            core.setOutput('release_id', release.id.toString());
            core.setOutput('tag_name', tagName);

  build-macos:
    name: Build macOS (${{ matrix.name }})
    needs: create-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: Apple Silicon (aarch64)
          - target: x86_64-apple-darwin
            name: Intel (x64)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri DMG & Upload to Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          args: --target ${{ matrix.target }} --ignore-version-mismatches

  publish-release:
    name: Publish Release
    needs: [create-release, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Normalize latest.json updater manifest
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        with:
          script: |
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const tagName = process.env.TAG_NAME;

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });

            console.log(`Found ${assets.length} assets in release ${releaseId}`);
            const latestAsset = assets.find((a) => a.name === 'latest.json');

            const aarch64Tar = assets.find((a) => a.name.includes('aarch64') && a.name.endsWith('.app.tar.gz'));
            const aarch64Sig = assets.find((a) => a.name.includes('aarch64') && a.name.endsWith('.app.tar.gz.sig'));
            const x64Tar = assets.find((a) => (a.name.includes('x64') || a.name.includes('x86_64')) && a.name.endsWith('.app.tar.gz'));
            const x64Sig = assets.find((a) => (a.name.includes('x64') || a.name.includes('x86_64')) && a.name.endsWith('.app.tar.gz.sig'));

            async function fetchAssetText(asset) {
              const res = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              });
              return Buffer.from(res.data).toString('utf8').trim();
            }

            let manifest = {
              version: tagName.replace(/^v/, ''),
              notes: `Release ${tagName}`,
              pub_date: new Date().toISOString(),
              platforms: {},
            };

            if (latestAsset) {
              try {
                const text = await fetchAssetText(latestAsset);
                manifest = JSON.parse(text);
              } catch (e) {
                console.log('Failed to parse existing latest.json, recreating:', e.message);
              }
            }

            if (!manifest.platforms) manifest.platforms = {};
            const downloadBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tagName}`;

            if (aarch64Tar) {
              let sig = manifest.platforms['darwin-aarch64']?.signature;
              if (!sig && aarch64Sig) {
                sig = await fetchAssetText(aarch64Sig);
              }
              if (sig) {
                const downloadUrl = `${downloadBase}/${aarch64Tar.name}`;
                manifest.platforms['darwin-aarch64'] = {
                  signature: sig,
                  url: downloadUrl,
                };
                manifest.platforms['darwin-aarch64-app'] = {
                  signature: sig,
                  url: downloadUrl,
                };
              }
            }

            if (x64Tar) {
              let sig = manifest.platforms['darwin-x86_64']?.signature;
              if (!sig && x64Sig) {
                sig = await fetchAssetText(x64Sig);
              }
              if (sig) {
                const downloadUrl = `${downloadBase}/${x64Tar.name}`;
                manifest.platforms['darwin-x86_64'] = {
                  signature: sig,
                  url: downloadUrl,
                };
                manifest.platforms['darwin-x86_64-app'] = {
                  signature: sig,
                  url: downloadUrl,
                };
              }
            }

            if (latestAsset) {
              console.log(`Deleting old latest.json (asset ID: ${latestAsset.id})...`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: latestAsset.id,
              });
            }

            const updatedBody = JSON.stringify(manifest, null, 2);
            console.log('Uploading corrected latest.json with browser_download_url:');
            console.log(updatedBody);

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'latest.json',
              data: Buffer.from(updatedBody, 'utf8'),
              headers: {
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(updatedBody),
              },
            });
            console.log('latest.json normalized and uploaded successfully.');

      - name: Publish Release if not requested as Draft
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          DRAFT: ${{ inputs.draft || 'false' }}
        with:
          script: |
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const isDraftRequested = process.env.DRAFT === 'true';

            if (!isDraftRequested) {
              console.log(`Publishing release ID: ${releaseId}`);
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                draft: false,
              });
              console.log('Release published successfully.');
            } else {
              console.log('Draft release preserved as requested.');
            }
